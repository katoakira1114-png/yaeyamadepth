// Generated by "npx cap sync", then pointed at ../vendor (copies of the plugin sources) so no Node.js is needed to build.
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../vendor/capacitor-android')

include ':capacitor-app'
project(':capacitor-app').projectDir = new File('../vendor/capacitor-app')

include ':capacitor-filesystem'
project(':capacitor-filesystem').projectDir = new File('../vendor/capacitor-filesystem')

include ':capacitor-share'
project(':capacitor-share').projectDir = new File('../vendor/capacitor-share')

include ':capacitor-community-background-geolocation'
project(':capacitor-community-background-geolocation').projectDir = new File('../vendor/capacitor-community-background-geolocation')

include ':capacitor-community-speech-recognition'
project(':capacitor-community-speech-recognition').projectDir = new File('../vendor/capacitor-community-speech-recognition')
